services:
  - type: worker
    name: vault-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: vault-bot-data
      mountPath: /var/data
      sizeGB: 1
